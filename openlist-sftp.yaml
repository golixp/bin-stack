---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openlist-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openlist
  template:
    metadata:
      labels:
        app: openlist
    spec:
      containers:
        - name: openlist
          image: openlistteam/openlist:latest
          volumeMounts:
            - name: openlist-data
              mountPath: /opt/openlist/data
      volumes:
        - name: openlist-data
          persistentVolumeClaim:
            claimName: openlist-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: openlist-http-service
spec:
  selector:
    app: openlist
  type: ClusterIP
  # 需要使用IP访问则使用NodePort模式
  # type: NodePort
  ports:
    - name: http
      port: 5244
      targetPort: 5244
      # 使用NodePort模式需要指定端口, 默认限制30000-32767 端口范围
      # nodePort: 30244

---

apiVersion: v1
kind: Service
metadata:
  name: openlist-sftp-service
spec:
  selector:
    app: openlist
  type: NodePort
  ports:
    - name: sftp
      port: 5222
      targetPort: 5222
      nodePort: 30022
