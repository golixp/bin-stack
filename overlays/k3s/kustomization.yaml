apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../components/openlist-base
  - ../../components/config
  - ../../components/secrets
  - ../../components/openlist-cf-tunnel
  # - ../../components/openlist-sftp
  # - ../../components/openlist-node-port
  # - ../../components/cert-manager
  # - ../../components/openlist-ingress

# 从 ConfigMap 替换非敏感配置
replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.OPENLIST_DOMAIN
    targets:
      - select:
          kind: Ingress
          name: openlist-ingress
        fieldPaths:
          - spec.rules.0.host
      - select:
          kind: Ingress
          name: openlist-ingress
        fieldPaths:
          - spec.tls.0.hosts.0
      - select:
          kind: Certificate
          name: openlist-cert
        fieldPaths:
          - spec.dnsNames.0

  # 从 ConfigMap 替换邮箱配置
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.EMAIL
    targets:
      - select:
          kind: ClusterIssuer
          name: cloudflare-issuer
        fieldPaths:
          - spec.acme.email
      - select:
          kind: ClusterIssuer
          name: cloudflare-issuer
        fieldPaths:
          - spec.acme.solvers.0.dns01.cloudflare.email
