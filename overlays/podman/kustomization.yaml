apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Podman 本地环境配置
# 仅核心服务，用于本地测试

resources:
  - ../../components/openlist-base

# 使用 patches 为 Deployment 注入端口配置和安全上下文
patches:
  # 添加端口配置
  - target:
      kind: Deployment
      name: openlist
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/ports
        value:
          - containerPort: 5244
            hostPort: 30244
  # 添加安全上下文解决 Podman PVC 权限问题
  - target:
      kind: Deployment
      name: openlist
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          fsGroup: 0
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
